<!DOCTYPE html>
<html lang="en">
<head>

  <title>Ask the Examiner — AI Driving Test Help | Coach Carter Reading</title>
  <meta name="description" content="Ask any question about the UK driving test marking scheme and get instant, accurate answers powered by AI. Grounded in real DVSA examiner guidance. Free from Coach Carter Driving School.">

  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Lato:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet" media="print" data-swap-media>
  <noscript><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Lato:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet"></noscript>

  <link rel="stylesheet" href="/shared/learner.css">
  <script src="/shared/dark-mode.js"></script>
  <script src="/shared/font-swap.js"></script>
  <style>
    /* ── ASK THE EXAMINER — editorial DL25 dossier aesthetic ───
       Concept: an interrogation room conversation with a DVSA
       examiner. Mono headers, file-folder document framing,
       editorial spacing. Built for dark mode primarily — the
       learner hub auto-enables dark via cc-has-sidebar. */

    body { display: flex; flex-direction: column; min-height: 100dvh; }

    /* Mono font for numerals, references, labels — adds gravitas
       without pulling in a new file. JetBrains Mono fallback chain. */
    :root {
      --font-mono: 'JetBrains Mono', 'SF Mono', ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
      --hairline: rgba(245,131,33,0.18);
    }

    /* ── DOSSIER MASTHEAD ── */
    .examiner-masthead {
      max-width: 760px; width: 100%; margin: 0 auto;
      padding: 28px 24px 22px;
      border-bottom: 1px dashed var(--border);
      position: relative;
    }

    .masthead-meta {
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--font-mono); font-size: 0.66rem;
      color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase;
      margin-bottom: 14px;
    }
    .masthead-meta-left { display: flex; align-items: center; gap: 8px; }
    .masthead-tag {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px; border-radius: 3px;
      background: var(--accent); color: #fff;
      font-weight: 700; letter-spacing: 0.08em;
    }
    .masthead-ref { color: var(--muted); }
    .masthead-ref .dot { color: var(--accent); margin: 0 4px; }
    .masthead-status {
      display: inline-flex; align-items: center; gap: 5px;
    }
    .masthead-status::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--green); box-shadow: 0 0 0 3px rgba(74,222,128,0.18);
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 3px rgba(74,222,128,0.18); }
      50% { opacity: 0.5; box-shadow: 0 0 0 5px rgba(74,222,128,0.05); }
    }

    .masthead-title {
      font-family: var(--font-head);
      font-size: clamp(1.85rem, 5.5vw, 2.5rem);
      font-weight: 800; line-height: 0.98;
      letter-spacing: -0.045em;
      margin-bottom: 10px;
      text-wrap: balance;
    }
    .masthead-title em {
      font-style: italic; font-weight: 700;
      color: var(--accent);
      position: relative;
    }
    .masthead-deck {
      font-family: var(--font-body); font-size: 0.92rem;
      color: var(--muted); line-height: 1.55;
      max-width: 52ch;
    }

    /* ── CONVERSATION COLUMN ── */
    .chat-container {
      flex: 1; display: flex; flex-direction: column;
      max-width: 760px; width: 100%; margin: 0 auto;
      padding-bottom: 200px;
    }

    .chat-messages {
      flex: 1; padding: 24px 24px 8px;
      display: flex; flex-direction: column; gap: 20px;
    }

    /* Each turn is a left-rail document, not a chat bubble */
    .msg {
      max-width: 100%;
      animation: msgIn 0.32s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    .msg-rail {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-mono); font-size: 0.65rem;
      color: var(--muted); letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .msg-rail-num {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 18px; padding: 0 5px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 3px; color: var(--primary);
      font-weight: 700; letter-spacing: 0.04em;
    }
    .msg.assistant .msg-rail-label { color: var(--accent); font-weight: 700; }
    .msg-rail-divider { flex: 1; height: 1px; background: var(--border); }

    .msg-body {
      font-size: 0.95rem; line-height: 1.68;
      padding-left: 14px;
      border-left: 2px solid var(--border);
    }
    .msg.user .msg-body {
      color: var(--primary); font-weight: 500;
      border-left-color: var(--primary);
    }
    .msg.assistant .msg-body {
      color: var(--primary);
      border-left-color: var(--accent);
    }

    /* Markdown inside assistant body */
    .msg-body h4 { font-family: var(--font-head); font-size: 1.02rem; font-weight: 700; margin: 14px 0 6px; letter-spacing: -0.01em; }
    .msg-body h4:first-child { margin-top: 0; }
    .msg-body h5 { font-family: var(--font-head); font-size: 0.92rem; font-weight: 700; margin: 10px 0 4px; }
    .msg-body h5:first-child { margin-top: 0; }
    .msg-body strong { font-weight: 700; color: var(--primary); }
    .msg-body em { font-style: italic; }
    .msg-body code {
      font-family: var(--font-mono); font-size: 0.84em;
      background: var(--surface); border: 1px solid var(--border);
      padding: 1px 6px; border-radius: 4px;
    }
    .msg-body ul, .msg-body ol { margin: 6px 0 6px 18px; }
    .msg-body li { margin-bottom: 4px; }
    .msg-body p { margin-bottom: 10px; }
    .msg-body p:last-child { margin-bottom: 0; }

    /* ── TYPING INDICATOR ── matches the rail aesthetic */
    .typing-indicator { display: none; animation: msgIn 0.32s ease both; }
    .typing-indicator.show { display: block; padding: 0 24px; }
    .typing-content {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border-left: 2px solid var(--accent);
      color: var(--muted); font-family: var(--font-mono); font-size: 0.7rem;
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .typing-dots { display: inline-flex; gap: 4px; align-items: center; }
    .typing-dots span {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); opacity: 0.4;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── PROMPT BRIEFING — replaces the chip cloud ──
       A composed empty state with a small instructional copy and
       a stack of asymmetric "case file" prompt entries. */
    .briefing {
      padding: 0 24px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .briefing-intro {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-mono); font-size: 0.66rem;
      color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase;
    }
    .briefing-intro-line { flex: 1; height: 1px; background: var(--border); }

    .briefing-prompts { display: flex; flex-direction: column; gap: 6px; }
    .briefing-prompt {
      display: grid; grid-template-columns: 32px 1fr auto;
      align-items: center; gap: 14px;
      padding: 14px 6px 14px 10px;
      background: transparent; border: none; border-top: 1px solid var(--border);
      cursor: pointer; text-align: left;
      font-family: var(--font-body); color: var(--primary);
      transition: padding 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.2s;
      position: relative;
    }
    .briefing-prompt:last-child { border-bottom: 1px solid var(--border); }
    .briefing-prompt::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 0; background: var(--accent);
      transition: width 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .briefing-prompt:hover { padding-left: 18px; background: var(--accent-mid); }
    .briefing-prompt:hover::before { width: 3px; }

    .briefing-prompt-num {
      font-family: var(--font-mono); font-size: 0.68rem; font-weight: 700;
      color: var(--muted); letter-spacing: 0.06em;
    }
    .briefing-prompt:hover .briefing-prompt-num { color: var(--accent); }

    .briefing-prompt-text {
      font-size: 0.95rem; font-weight: 500; line-height: 1.4;
    }
    .briefing-prompt-arrow {
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.2s;
    }
    .briefing-prompt:hover .briefing-prompt-arrow {
      color: var(--accent); transform: translateX(4px);
    }
    .briefing-prompt-arrow svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }

    /* ── INPUT DOCK ── */
    .chat-input-area {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      border-top: 1px solid var(--border);
      padding: 14px 24px max(14px, env(safe-area-inset-bottom)); z-index: 998;
    }
    body.cc-has-bottom-bar .chat-input-area {
      bottom: calc(60px + env(safe-area-inset-bottom, 0px));
      padding-bottom: 14px;
    }
    .chat-input-wrap {
      max-width: 760px; margin: 0 auto;
      display: flex; gap: 10px; align-items: stretch;
      position: relative;
    }

    .chat-input-shell {
      flex: 1; position: relative;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .chat-input-shell:focus-within {
      border-color: var(--accent);
      background: var(--white);
      box-shadow: 0 0 0 4px var(--accent-mid);
    }
    .chat-input-prefix {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700;
      color: var(--accent); letter-spacing: 0.08em;
      pointer-events: none;
    }
    .chat-input {
      width: 100%; padding: 14px 16px 14px 46px;
      border: none; outline: none; background: transparent;
      font-family: var(--font-body); font-size: 0.92rem;
      color: var(--primary);
    }
    .chat-input::placeholder { color: var(--muted); opacity: 0.7; }

    .chat-send {
      width: 48px; min-width: 48px; border-radius: 12px; border: none;
      background: var(--accent); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(245,131,33,0.25);
    }
    .chat-send:hover:not(:disabled) {
      background: var(--accent-dk);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(245,131,33,0.45);
    }
    .chat-send:active:not(:disabled) { transform: translateY(0) scale(0.97); }
    .chat-send:disabled {
      background: var(--border); cursor: default;
      box-shadow: none; opacity: 0.6;
    }
    .chat-send svg { width: 18px; height: 18px; fill: currentColor; }

    .chat-hint {
      font-family: var(--font-mono); font-size: 0.62rem;
      color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase;
      margin-top: 8px; text-align: center; opacity: 0.7;
    }
    .chat-hint kbd {
      display: inline-block;
      padding: 1px 5px; border-radius: 3px;
      background: var(--surface); border: 1px solid var(--border);
      font-family: inherit; font-size: 0.95em; color: var(--primary);
    }

    .error-msg {
      margin: 0 24px;
      padding: 10px 14px;
      color: var(--red); font-size: 0.85rem;
      background: var(--red-lt); border: 1px solid var(--red);
      border-radius: 8px; display: none;
    }
    .error-msg.show { display: block; }

    /* Desktop tuning */
    @media (min-width: 720px) {
      .examiner-masthead { padding-top: 40px; padding-bottom: 28px; }
      .chat-messages { padding: 32px 24px 8px; }
      .briefing { padding: 0 24px; }
    }
  </style>
</head>
<body>

<header class="examiner-masthead">
  <div class="masthead-meta">
    <div class="masthead-meta-left">
      <span class="masthead-tag">DL25</span>
      <span class="masthead-ref">Marking sheet<span class="dot">·</span>Live reference</span>
    </div>
    <div class="masthead-status">Online</div>
  </div>
  <h1 class="masthead-title">Ask the <em>examiner</em>.</h1>
  <p class="masthead-deck">Cross-checked against the real DVSA driving-test marking criteria. Ask anything about faults, scoring, manoeuvres, or what happens on the day.</p>
</header>

<main class="chat-container">
  <div class="chat-messages" id="chat-messages">
    <section class="briefing" id="starter-chips" aria-label="Suggested starter questions">
      <div class="briefing-intro">
        <span>Start a line of questioning</span>
        <span class="briefing-intro-line"></span>
      </div>
      <div class="briefing-prompts">
        <button class="briefing-prompt" data-action="ask-chip" type="button">
          <span class="briefing-prompt-num">Q.01</span>
          <span class="briefing-prompt-text">What happens if I stall during the test?</span>
          <span class="briefing-prompt-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>
        <button class="briefing-prompt" data-action="ask-chip" type="button">
          <span class="briefing-prompt-num">Q.02</span>
          <span class="briefing-prompt-text">How are manoeuvres marked?</span>
          <span class="briefing-prompt-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>
        <button class="briefing-prompt" data-action="ask-chip" type="button">
          <span class="briefing-prompt-num">Q.03</span>
          <span class="briefing-prompt-text">Can I fail for driving too slowly?</span>
          <span class="briefing-prompt-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>
        <button class="briefing-prompt" data-action="ask-chip" type="button">
          <span class="briefing-prompt-num">Q.04</span>
          <span class="briefing-prompt-text">What does the examiner look for at junctions?</span>
          <span class="briefing-prompt-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>
        <button class="briefing-prompt" data-action="ask-chip" type="button">
          <span class="briefing-prompt-num">Q.05</span>
          <span class="briefing-prompt-text">How many minors can I get?</span>
          <span class="briefing-prompt-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>
      </div>
    </section>
  </div>

  <div class="typing-indicator" id="typing-indicator">
    <div class="typing-content">
      <span>Examiner is reviewing</span>
      <span class="typing-dots"><span></span><span></span><span></span></span>
    </div>
  </div>

  <div class="error-msg" id="error-msg"></div>
</main>

<div class="chat-input-area">
  <div class="chat-input-wrap">
    <div class="chat-input-shell">
      <span class="chat-input-prefix">ASK</span>
      <input type="text" class="chat-input" id="chat-input" placeholder="What's on your mind about the test?" autocomplete="off">
    </div>
    <button class="chat-send" id="chat-send" aria-label="Send question">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="chat-hint">Hit <kbd>↵</kbd> to send</div>
</div>

<script src="/learner/ask-examiner.js"></script>
</body>
</html>
